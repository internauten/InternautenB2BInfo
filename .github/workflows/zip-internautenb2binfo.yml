name: Build internautenb2binfo zip

on:
  push:
    paths:
      - 'internautenb2binfo/**'
      - '.github/workflows/zip-internautenb2binfo.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create zip
        run: |
          zip -r internautenb2binfo.zip internautenb2binfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: internautenb2binfo-zip
          path: internautenb2binfo.zip
          if-no-files-found: error

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "## $TAG" > release-notes.md
          # Matches headings like "## [1.0.9] - 2026-09-24", "## 1.0.9" or "## v1.0.9".
          awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            { sub(/\r$/, "") }
            /^##[[:space:]]/ {
              if (found) exit
              h = $0
              sub(/^##[[:space:]]+/, "", h)
              sub(/^\[/, "", h)
              sub(/^v/, "", h)
              sub(/\].*$/, "", h)
              sub(/[[:space:]].*$/, "", h)
              if (h == ver) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md >> release-notes.md
          if [ $(wc -l < release-notes.md) -lt 2 ]; then
            echo "- No changelog section found for $TAG." >> release-notes.md
          fi
          echo "" >> release-notes.md
          echo "### Commits" >> release-notes.md
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$TAG"
          else
            RANGE="$TAG"
          fi
          git log "$RANGE" --pretty=format:"- %s (%h, %an, %ad)%n%b" --date=short \
            | awk '{if ($0 ~ /^- /) {print $0} else if (length($0) == 0) {print ""} else {print "  " $0}}' \
            >> release-notes.md
          if [ $(grep -c "^- " release-notes.md) -lt 2 ]; then
            echo "- No changes found for $TAG." >> release-notes.md
          fi

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: internautenb2binfo ${{ github.ref_name }}
          body_path: release-notes.md
          files: internautenb2binfo.zip
